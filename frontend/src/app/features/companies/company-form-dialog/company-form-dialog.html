<h2 mat-dialog-title>{{ isEdit ? 'Edit company' : 'New company' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Acme Inc" />
      @if (form.controls.name.hasError('required') && form.controls.name.touched) {
        <mat-error>Name is required</mat-error>
      }
      @if (form.controls.name.hasError('minlength') && form.controls.name.touched) {
        <mat-error>At least 2 characters</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Industry</mat-label>
      <input matInput formControlName="industry" placeholder="Software" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Website</mat-label>
      <input matInput formControlName="website" placeholder="https://acme.com" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Phone</mat-label>
      <input matInput formControlName="phone" placeholder="+380..." />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="loading()">Cancel</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="loading()">
    @if (loading()) {
      <mat-spinner diameter="20"></mat-spinner>
    } @else {
      {{ isEdit ? 'Save' : 'Create' }}
    }
  </button>
</mat-dialog-actions>
